[package]
name = "rustbac-datalink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BACnet data-link transports and traits for rustbac."
repository = "https://github.com/rbhans/rust-bac"

[features]
default = ["std"]
std = ["rustbac-core/std", "dep:tokio", "dep:thiserror", "dep:log"]
alloc = ["rustbac-core/alloc"]
serde = ["dep:serde", "rustbac-core/serde"]

[dependencies]
rustbac-core = { path = "../rustbac-core", version = "0.4.0", default-features = false }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
log = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["std"] }
